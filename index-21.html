<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AJM Oil and Gas | Business Monitor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<style>
  :root{
    --navy-deep:#050a16;
    --navy:#0a1428;
    --navy-mid:#0f1e3d;
    --navy-light:#16294f;
    --blue:#2a5cd6;
    --blue-bright:#3f74ff;
    --gold:#d4a94f;
    --gold-bright:#f0c674;
    --text:#eef2fa;
    --text-dim:#9fb0cf;
    --danger:#e5484d;
    --danger-bg:#3a1418;
    --success:#2fb872;
    --success-bg:#0f2d1f;
    --warn:#e0a336;
    --warn-bg:#332309;
    --border:#1e3255;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(ellipse at top,#0c1830 0%,var(--navy-deep) 60%);
    color:var(--text);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;}

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px;}

  /* ===== LOGIN / SPLASH ===== */
  .splash{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;gap:8px;
  }
  .brand-mark{
    width:84px;height:84px;border-radius:20px;
    background:linear-gradient(145deg,var(--blue-bright),#173a8a);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:#fff;letter-spacing:-1px;
    box-shadow:0 12px 40px rgba(42,92,214,.45), inset 0 1px 0 rgba(255,255,255,.2);
    margin-bottom:18px;
  }
  .brand-title{font-size:26px;font-weight:800;letter-spacing:.5px;}
  .brand-sub{color:var(--gold-bright);font-size:12.5px;letter-spacing:3px;text-transform:uppercase;margin-top:4px;font-weight:600;}
  .brand-tag{color:var(--text-dim);font-size:13px;margin-top:14px;max-width:280px;line-height:1.5;}

  .role-cards{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;margin-top:36px;}
  .role-card{
    background:linear-gradient(155deg,var(--navy-mid),var(--navy-light));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;text-align:left;display:flex;align-items:center;gap:16px;
    cursor:pointer;transition:transform .15s, border-color .15s;
  }
  .role-card:active{transform:scale(.97);}
  .role-card:hover{border-color:var(--blue);}
  .role-icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:rgba(63,116,255,.15);color:var(--blue-bright);
  }
  .role-icon.gold{background:rgba(212,169,79,.15);color:var(--gold-bright);}
  .role-title{font-weight:700;font-size:15.5px;}
  .role-desc{color:var(--text-dim);font-size:12.5px;margin-top:2px;}

  /* ===== LOGIN FORM ===== */
  .login-box{
    width:100%;max-width:380px;margin-top:28px;
    background:linear-gradient(155deg,var(--navy-mid),var(--navy-light));
    border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;
  }
  .login-box h3{font-size:16px;margin-bottom:4px;}
  .login-box p.hint{color:var(--text-dim);font-size:12px;margin-bottom:18px;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:600;letter-spacing:.3px;}
  .field select,.field input,.field textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--navy-deep);color:var(--text);font-size:15px;font-family:inherit;
  }
  .field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue-bright);}
  .field textarea{resize:vertical;min-height:70px;}
  .btn{
    width:100%;padding:13px;border-radius:10px;border:none;font-weight:700;font-size:14.5px;
    cursor:pointer;transition:opacity .15s, transform .1s;letter-spacing:.3px;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--blue-bright),#1c3f9c);color:#fff;}
  .btn-gold{background:linear-gradient(135deg,var(--gold-bright),#b7883a);color:#1a1204;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:9px 14px;font-size:13px;width:auto;}
  .btn-block-row{display:flex;gap:10px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .back-link{color:var(--text-dim);font-size:13px;margin-top:18px;cursor:pointer;text-decoration:underline;}
  .error-msg{background:var(--danger-bg);color:#ff9d9f;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px;border:1px solid #5c1f22;}

  /* ===== HEADER / NAV ===== */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(10,20,40,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .who{display:flex;flex-direction:column;}
  .topbar .who .name{font-weight:700;font-size:14.5px;}
  .topbar .who .role{font-size:11px;color:var(--gold-bright);letter-spacing:1px;text-transform:uppercase;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;background:var(--navy-light);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    color:var(--text);cursor:pointer;font-size:16px;position:relative;
  }
  .badge-dot{
    position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  .content{padding:18px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold-bright);font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title:first-child{margin-top:0;}

  /* ===== STAT CARDS ===== */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{
    background:linear-gradient(155deg,var(--navy-mid),var(--navy-light));
    border:1px solid var(--border);border-radius:12px;padding:14px;
  }
  .stat-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
  .stat-card .value{font-size:19px;font-weight:800;margin-top:5px;}
  .stat-card .sub{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .stat-card.alert{border-color:var(--danger);background:linear-gradient(155deg,#2a1214,#3a1418);}
  .stat-card.alert .value{color:#ff9d9f;}
  .stat-card.good{border-color:var(--success);}
  .stat-card.good .value{color:#7de3ab;}

  /* ===== CARDS / LIST ITEMS ===== */
  .card{
    background:linear-gradient(155deg,var(--navy-mid),var(--navy-light));
    border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  }
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-weight:700;font-size:14.5px;}
  .card-meta{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .pill{
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
  }
  .pill-pending{background:var(--warn-bg);color:var(--warn);}
  .pill-approved{background:var(--success-bg);color:var(--success);}
  .pill-rejected{background:var(--danger-bg);color:#ff9d9f;}
  .pill-flag{background:var(--danger-bg);color:#ff9d9f;}
  .card-body{margin-top:10px;font-size:13px;color:var(--text-dim);line-height:1.6;}
  .card-body b{color:var(--text);}
  .card-actions{display:flex;gap:8px;margin-top:12px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-state .icon{font-size:34px;margin-bottom:10px;opacity:.6;}
  .empty-state p{font-size:13px;}

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    max-width:520px;margin:0 auto;
    background:rgba(10,20,40,.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;cursor:pointer;color:var(--text-dim);border-radius:10px;position:relative;
  }
  .nav-item.active{color:var(--gold-bright);}
  .nav-item .nav-icon{font-size:19px;}
  .nav-item .nav-label{font-size:10px;font-weight:600;}
  .nav-item .badge-dot{top:0;right:14px;}

  /* ===== MODAL / FORM SHEET ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(3,7,16,.75);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--navy);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    max-height:92vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
  }
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .sheet-header h3{font-size:17px;}
  .sheet-close{color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;padding:4px;}

  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-upload{
    border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;
    cursor:pointer;color:var(--text-dim);font-size:13px;position:relative;overflow:hidden;
  }
  .photo-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:10px;}
  .photo-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;
    background:var(--navy-light);border:1px solid var(--border);border-radius:10px;
    padding:12px 18px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:90%;text-align:center;
  }
  .toast.success{border-color:var(--success);color:#7de3ab;}
  .toast.error{border-color:var(--danger);color:#ff9d9f;}

  .divider{height:1px;background:var(--border);margin:18px 0;}
  .fab{
    position:fixed;bottom:100px;right:calc(50% - 260px + 18px);z-index:45;
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,var(--gold-bright),#b7883a);
    color:#1a1204;font-size:26px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(212,169,79,.4);cursor:pointer;border:none;
  }
  @media (max-width:560px){.fab{right:18px;}}

  .loader{
    width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-pad{display:flex;align-items:center;justify-content:center;padding:60px 0;}

  .tabs{display:flex;background:var(--navy-mid);border-radius:10px;padding:4px;margin-bottom:16px;border:1px solid var(--border);}
  .tab{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--text-dim);}
  .tab.active{background:var(--blue-bright);color:#fff;}

  .discrepancy-banner{
    background:linear-gradient(135deg,var(--danger-bg),#2a1214);border:1px solid #5c1f22;
    border-radius:12px;padding:14px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;
  }
  .discrepancy-banner .ic{font-size:22px;}
  .discrepancy-banner .txt{font-size:12.5px;color:#ffb8b9;line-height:1.5;}
  .discrepancy-banner .txt b{color:#fff;}

  .link-btn{color:var(--blue-bright);font-size:13px;font-weight:600;cursor:pointer;}
  a{color:inherit;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
